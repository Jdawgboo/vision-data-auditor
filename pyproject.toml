[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-data-auditor"
version = "0.1.0"
description = "Manifest-based file, duplicate, and class-balance checks for vision datasets"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
vision-data-auditor = "vision_data_auditor:main"

[tool.setuptools]
py-modules = ["vision_data_auditor"]
package-dir = {"" = "src"}
